<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Emblema reducido de Evernight (zona segura 66 dp)">
  <defs>
    <linearGradient id="red-moon-shadow" x1="0%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#630E15" />
      <stop offset="45%" stop-color="#38060A" />
      <stop offset="100%" stop-color="#1D0305" />
    </linearGradient>

    <radialGradient id="red-moon-bright" cx="68%" cy="60%" r="58%">
      <stop offset="0%" stop-color="#FF7878" />
      <stop offset="32%" stop-color="#F22738" />
      <stop offset="80%" stop-color="#C21322" />
      <stop offset="100%" stop-color="#8F0C18" />
    </radialGradient>

    <linearGradient id="red-silver-rose" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF7F5" />
      <stop offset="48%" stop-color="#F0D8D5" />
      <stop offset="100%" stop-color="#BA9695" />
    </linearGradient>

    <clipPath id="red-moon-clip">
      <circle cx="54" cy="54" r="13.5" />
    </clipPath>
  </defs>

  <!-- Todo el contenido vive dentro del círculo seguro de 66 dp (r <= 32.3 en viewBox 0 0 108 108) -->
  <g>
    <g clip-path="url(#red-moon-clip)">
      <circle cx="54" cy="54" r="13.5" fill="url(#red-moon-shadow)" />
      <path d="M 56.34,40.71 A 13.5,13.5 0 1 1 47.66,65.92 C 53.0,59.2 56.1,51.0 56.34,40.71 Z" fill="url(#red-moon-bright)" />
    </g>
    <circle cx="54" cy="54" r="13.5" fill="none" stroke="#7A131C" stroke-width="0.45" />
  </g>

  <!-- Garra en medialuna (collar continuo + 4 cuchillas afiladas separadas, r >= 13.7) -->
  <g fill="url(#red-silver-rose)">
    <path d="M 40.3,54 A 13.7,13.7 0 1 1 67.7,54 A 13.7,13.7 0 1 1 40.3,54 M 38.2,54 A 15.8,15.8 0 1 0 69.8,54 A 15.8,15.8 0 1 0 38.2,54 Z" fill-rule="evenodd" />
    <path d="M 59.94,41.54 C 54.40,33.40 40.50,34.40 29.87,39.79 C 39.50,37.50 49.80,38.10 55.85,38.91 Q 58.05,40.08 59.94,41.54 Z" />
    <path d="M 41.54,48.06 C 33.40,53.60 34.40,67.50 39.79,78.13 C 37.50,68.50 38.10,58.20 38.91,52.15 Q 40.08,49.95 41.54,48.06 Z" />
    <path d="M 48.06,66.46 C 53.60,74.60 67.50,73.60 78.13,68.21 C 68.50,70.50 58.20,69.90 52.15,69.09 Q 49.95,67.92 48.06,66.46 Z" />
    <path d="M 66.46,59.94 C 74.60,54.40 73.60,40.50 68.21,29.87 C 70.50,39.50 69.90,49.80 69.09,55.85 Q 67.92,58.05 66.46,59.94 Z" />
  </g>

  <!-- 4 estrellas cardinales dentro del círculo seguro de 66 dp (largo 13.4 <= radio lunar 13.5) -->
  <g fill="#FFF5F3">
    <path d="M 54.00,21.70 C 54.51,26.39 55.23,27.57 58.10,28.40 C 55.23,29.23 54.51,30.41 54.00,35.10 C 53.49,30.41 52.77,29.23 49.90,28.40 C 52.77,27.57 53.49,26.39 54.00,21.70 Z" />
    <path d="M 54.00,72.90 C 54.51,77.59 55.23,78.77 58.10,79.60 C 55.23,80.43 54.51,81.61 54.00,86.30 C 53.49,81.61 52.77,80.43 49.90,79.60 C 52.77,78.77 53.49,77.59 54.00,72.90 Z" />
    <path d="M 28.40,49.90 C 29.23,52.77 30.41,53.49 35.10,54.00 C 30.41,54.51 29.23,55.23 28.40,58.10 C 27.57,55.23 26.39,54.51 21.70,54.00 C 26.39,53.49 27.57,52.77 28.40,49.90 Z" />
    <path d="M 79.60,49.90 C 80.43,52.77 81.61,53.49 86.30,54.00 C 81.61,54.51 80.43,55.23 79.60,58.10 C 78.77,55.23 77.59,54.51 72.90,54.00 C 77.59,53.49 78.77,52.77 79.60,49.90 Z" />
  </g>
</svg>
